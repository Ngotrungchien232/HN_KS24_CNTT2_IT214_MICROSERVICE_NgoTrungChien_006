spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: roomtype-service-route
          uri: lb://roomtype-service
          predicates:
            - Path=/api/roomtypes/**
        - id: room-service-route
          uri: lb://room-service
          predicates:
            - Path=/api/rooms/**

server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
